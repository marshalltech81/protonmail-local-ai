# Semgrep rules for the Docker Compose files: the base file and every
# overlay (docker-compose*.yml / *.yaml and compose*.yml / *.yaml
# anywhere in the tree). They encode AGENTS.md "Network and exposure
# constraints", "Dockerfile Conventions" and "Container Runtime
# Hardening".
#
# Semgrep matches each file on its own; it does not merge overlays. So
# the rules come in two kinds:
#   - forbidden settings (privileged, namespaces shared with the host or
#     another container, cap_add, devices, docker socket, weakened
#     security_opt, read_only other than true, unbounded pids_limit or
#     logging, published ports, writable host bind mounts, extends and
#     volumes_from, extra services on bridge-net) apply to every file, so an overlay cannot
#     add them. A security setting whose value is interpolated
#     (`${VAR:-default}`) counts as unsafe, since its default can be;
#   - required hardening (read_only, no-new-privileges, cap_drop ALL,
#     pids_limit, logging) applies where a service is defined, that is
#     where it names a `build` or an `image`. An overlay that only
#     adjusts an existing service is not asked to repeat them, but it
#     cannot set any of the forbidden values above.
# What a file-by-file scan cannot see, such as an overlay's `!reset` or
# `!override` clearing inherited hardening, scripts/tests/compose_test.sh
# checks on the merged config of each overlay combination (#580).
#
# Every rule's paths.include lists each file name Docker Compose loads:
# the docker-compose* names and the newer compose* defaults, which
# Compose prefers when both exist. The fixture (.semgrep/compose.test.yml)
# matches compose*.yml, so .semgrep/ is excluded from the scan.
#
# Tests: .semgrep/compose.test.yml (run `semgrep test .semgrep`), and
# scripts/tests/semgrep_paths_test.sh, which checks that every rule
# reads every Compose file name, since `semgrep test` ignores `paths`.
rules:
  - id: compose-privileged
    languages: [yaml]
    severity: ERROR
    message: >-
      `privileged: true` gives the container every capability and all host
      devices. AGENTS.md forbids it without explicit owner approval. Any
      value other than a literal `false` is rejected, so an interpolated
      default such as `${PRIVILEGED:-true}` cannot slip through.
    paths:
      include:
        - "docker-compose*.yml"
        - "docker-compose*.yaml"
        - "compose*.yml"
        - "compose*.yaml"
      exclude:
        - ".semgrep/"
    patterns:
      - pattern: "privileged: $VALUE"
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?!false$)

  - id: compose-host-namespace
    languages: [yaml]
    severity: ERROR
    message: >-
      `$KEY: $VALUE` shares a namespace with the host or with another
      container. The host's removes the container's isolation (AGENTS.md
      forbids `network_mode: host`); another container's gives it that
      container's access, such as mbsync's route to Bridge. Interpolated
      values are rejected because their default can be either.
    paths:
      include:
        - "docker-compose*.yml"
        - "docker-compose*.yaml"
        - "compose*.yml"
        - "compose*.yaml"
      exclude:
        - ".semgrep/"
    patterns:
      - pattern: "$KEY: $VALUE"
      - metavariable-regex:
          metavariable: $KEY
          regex: ^(network_mode|pid|ipc|uts|userns_mode|cgroup)$
      - metavariable-regex:
          metavariable: $VALUE
          regex: (?i)^["']?(host|service:|container:|.*\$)

  - id: compose-cap-add
    languages: [yaml]
    severity: ERROR
    message: >-
      Services drop every capability and add none back (AGENTS.md
      "Container Runtime Hardening"). Adding a capability needs owner
      approval; allow-list it here with the reason if it is granted.
    paths:
      include:
        - "docker-compose*.yml"
        - "docker-compose*.yaml"
        - "compose*.yml"
        - "compose*.yaml"
      exclude:
        - ".semgrep/"
    pattern: "cap_add: $CAPS"

  - id: compose-host-devices
    languages: [yaml]
    severity: ERROR
    message: >-
      AGENTS.md forbids adding host devices to a container without
      explicit owner approval. `gpus` requests host GPU devices too.
    paths:
      include:
        - "docker-compose*.yml"
        - "docker-compose*.yaml"
        - "compose*.yml"
        - "compose*.yaml"
      exclude:
        - ".semgrep/"
    pattern-either:
      - pattern: "devices: $DEVICES"
      - pattern: "gpus: $GPUS"

  - id: compose-weakened-security-opt
    languages: [yaml]
    severity: ERROR
    message: >-
      `$OPT` disables seccomp, AppArmor, SELinux labelling or
      no-new-privileges, or is interpolated and so could. AGENTS.md keeps
      the default confinement in place.
    paths:
      include:
        - "docker-compose*.yml"
        - "docker-compose*.yaml"
        - "compose*.yml"
        - "compose*.yaml"
      exclude:
        - ".semgrep/"
    patterns:
      - pattern-inside: "security_opt: [..., $OPT, ...]"
      - pattern: $OPT
      - metavariable-regex:
          metavariable: $OPT
          regex: (?i)^["']?(seccomp|apparmor|systempaths)[:=]unconfined|^["']?label[:=](disable|type:\S*unconfined)|^["']?no-new-privileges[:=]false|.*\$

  - id: compose-read-only-disabled
    languages: [yaml]
    severity: ERROR
    message: >-
      `read_only: $VALUE` can leave the container's root filesystem
      writable. AGENTS.md prefers a read-only rootfs with tmpfs for
      writable paths; any value other than a literal `true` (including an
      interpolated one) is rejected.
    paths:
      include:
        - "docker-compose*.yml"
        - "docker-compose*.yaml"
        - "compose*.yml"
        - "compose*.yaml"
      exclude:
        - ".semgrep/"
    patterns:
      - pattern: "read_only: $VALUE"
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?!true$)

  - id: compose-pids-limit-unbounded
    languages: [yaml]
    severity: ERROR
    message: >-
      `pids_limit: $LIMIT` is not a positive number, so it leaves the
      process count unbounded (`-1` and `0` both mean no limit) or depends
      on interpolation.
    paths:
      include:
        - "docker-compose*.yml"
        - "docker-compose*.yaml"
        - "compose*.yml"
        - "compose*.yaml"
      exclude:
        - ".semgrep/"
    patterns:
      - pattern: "pids_limit: $LIMIT"
      - metavariable-regex:
          metavariable: $LIMIT
          regex: ^(?![1-9][0-9]*$)

  - id: compose-logging-unbounded
    languages: [yaml]
    severity: ERROR
    message: >-
      This logging configuration does not bound the log size. Use
      `logging: *default-logging` (json-file with a positive `max-size`),
      or `driver: none` as docker-compose.first-run.yml does for Bridge.
    paths:
      include:
        - "docker-compose*.yml"
        - "docker-compose*.yaml"
        - "compose*.yml"
        - "compose*.yaml"
      exclude:
        - ".semgrep/"
    pattern-either:
      # A logging block with no max-size, other than the drivers that keep
      # no unbounded file: none, and local (which rotates by default).
      - patterns:
          - pattern: "logging: $LOGGING"
          - pattern-not: |
              logging:
                ...
                options:
                  ...
                  max-size: $SIZE
                  ...
                ...
          - pattern-not: |
              logging:
                ...
                driver: none
                ...
          - pattern-not: |
              logging:
                ...
                driver: local
                ...
      # A max-size that is not a positive size (`-1` means unlimited).
      - patterns:
          - pattern-inside: "logging: $LOGGING"
          - pattern: "max-size: $SIZE"
          - metavariable-regex:
              metavariable: $SIZE
              regex: ^(?!["']?[1-9][0-9]*[kmgKMG]?["']?$)

  - id: compose-docker-socket
    languages: [yaml]
    severity: ERROR
    message: >-
      Mounting the Docker socket (directly, or through Compose's
      `use_api_socket`) gives the container control of the host's Docker
      daemon. AGENTS.md forbids it.
    paths:
      include:
        - "docker-compose*.yml"
        - "docker-compose*.yaml"
        - "compose*.yml"
        - "compose*.yaml"
      exclude:
        - ".semgrep/"
    pattern-either:
      - patterns:
          - pattern-inside: "volumes: [..., $VOL, ...]"
          - pattern: $VOL
          - metavariable-regex:
              metavariable: $VOL
              regex: (?s).*docker\.sock
      - patterns:
          - pattern: "use_api_socket: $VALUE"
          - metavariable-regex:
              metavariable: $VALUE
              regex: ^(?!false$)

  - id: compose-writable-host-bind-mount
    languages: [yaml]
    severity: ERROR
    message: >-
      `$VOL` mounts a host path writable. Host bind mounts are read-only
      (`:ro`, or `read_only: true` in the long syntax) so a compromised
      container cannot change files on the host; data the service writes
      belongs in a named volume.
    paths:
      include:
        - "docker-compose*.yml"
        - "docker-compose*.yaml"
        - "compose*.yml"
        - "compose*.yaml"
      exclude:
        - ".semgrep/"
    pattern-either:
      # Short syntax: a source that is a host path (relative, absolute,
      # home or a variable) whose mode list lacks `ro`.
      - patterns:
          - pattern-inside: "volumes: [..., $VOL, ...]"
          - pattern: $VOL
          - metavariable-regex:
              metavariable: $VOL
              regex: ^["']?(\.{0,2}/|~|\$)(?!.*:([a-z]+,)*ro(,[a-z]+)*["']?$)
      # A named volume backed by a host directory (local driver with
      # `o: bind`); its service-side mount looks like a named volume.
      - patterns:
          - pattern-inside: |
              driver_opts:
                ...
          - pattern: "o: $OPTS"
          - metavariable-regex:
              metavariable: $OPTS
              regex: (?i).*(\bbind\b|\$)
      # Long syntax: `type: bind` without `read_only: true`.
      - patterns:
          - pattern-inside: "volumes: [..., $VOL, ...]"
          - pattern: $VOL
          - pattern: |
              type: bind
              ...
          - pattern-not: |
              type: bind
              ...
              read_only: true
              ...

  - id: compose-port-on-other-service
    languages: [yaml]
    severity: ERROR
    message: >-
      Service `$SVC` publishes a port to the host. AGENTS.md allows only
      mcp-server:3000, bound to 127.0.0.1.
    paths:
      include:
        - "docker-compose*.yml"
        - "docker-compose*.yaml"
        - "compose*.yml"
        - "compose*.yaml"
      exclude:
        - ".semgrep/"
    patterns:
      - pattern-inside: |
          services:
            ...
      - pattern-inside: |
          $SVC:
            ...
            ports: $PORTS
            ...
      - pattern-inside: "ports: [..., $PORT, ...]"
      - pattern: $PORT
      - metavariable-regex:
          metavariable: $SVC
          regex: ^(?!mcp-server$)

  - id: compose-port-not-loopback
    languages: [yaml]
    severity: ERROR
    message: >-
      `$PORT` publishes something other than mcp-server:3000 on loopback.
      Bind it as "127.0.0.1:${MCP_PORT:-3000}:${MCP_PORT:-3000}" (AGENTS.md
      "Network and exposure constraints"); the long syntax is not
      accepted here.
    paths:
      include:
        - "docker-compose*.yml"
        - "docker-compose*.yaml"
        - "compose*.yml"
        - "compose*.yaml"
      exclude:
        - ".semgrep/"
    patterns:
      - pattern-inside: |
          services:
            ...
      - pattern-inside: |
          mcp-server:
            ...
            ports: $PORTS
            ...
      - pattern-inside: "ports: [..., $PORT, ...]"
      - pattern: $PORT
      - metavariable-regex:
          metavariable: $PORT
          regex: ^(?!["']?127\.0\.0\.1:(3000|\$\{MCP_PORT:-3000\}):(3000|\$\{MCP_PORT:-3000\})["']?$)

  - id: compose-interpolated-network
    languages: [yaml]
    severity: ERROR
    message: >-
      `$NET` is an interpolated network, so its default could be
      bridge-net. Name service networks literally.
    paths:
      include:
        - "docker-compose*.yml"
        - "docker-compose*.yaml"
        - "compose*.yml"
        - "compose*.yaml"
      exclude:
        - ".semgrep/"
    patterns:
      - pattern-inside: |
          services:
            ...
      - pattern-inside: "networks: [..., $NET, ...]"
      - pattern: $NET
      - metavariable-regex:
          metavariable: $NET
          regex: .*\$

  - id: compose-root-user
    languages: [yaml]
    severity: ERROR
    message: >-
      `user: $USER` runs the service as root (or, interpolated, could),
      overriding the image's dedicated non-root account (AGENTS.md
      "Dockerfile Conventions").
    paths:
      include:
        - "docker-compose*.yml"
        - "docker-compose*.yaml"
        - "compose*.yml"
        - "compose*.yaml"
      exclude:
        - ".semgrep/"
    patterns:
      - pattern: "user: $USER"
      - metavariable-regex:
          metavariable: $USER
          regex: ^["']?(root|[+-]?0+)(:|["']?$)|.*\$

  - id: compose-extends
    languages: [yaml]
    severity: ERROR
    message: >-
      `extends` inherits another service's networks, secrets and mounts
      without naming them here, so the other rules cannot see what the
      service gets (extending mbsync would hand over bridge-net and the
      Bridge password). Define the service in full instead.
    paths:
      include:
        - "docker-compose*.yml"
        - "docker-compose*.yaml"
        - "compose*.yml"
        - "compose*.yaml"
      exclude:
        - ".semgrep/"
    pattern: "extends: $BASE"

  - id: compose-volumes-from
    languages: [yaml]
    severity: ERROR
    message: >-
      `volumes_from` mounts every volume of another service or container
      without naming them here, so the other rules cannot see what the
      service gets (from mbsync it would hand mcp-server the Maildir).
      Name each volume the service needs instead.
    paths:
      include:
        - "docker-compose*.yml"
        - "docker-compose*.yaml"
        - "compose*.yml"
        - "compose*.yaml"
      exclude:
        - ".semgrep/"
    pattern: "volumes_from: $SOURCES"

  - id: compose-include
    languages: [yaml]
    severity: ERROR
    message: >-
      A top-level `include` imports another file's services, networks and
      volumes. The fragment can have any name, so these rules may never
      scan it and the Compose path filters may never trigger on it. Put
      the services in a docker-compose*.yml overlay instead.
    paths:
      include:
        - "docker-compose*.yml"
        - "docker-compose*.yaml"
        - "compose*.yml"
        - "compose*.yaml"
      exclude:
        - ".semgrep/"
    # Only the root-level key imports anything; a nested `include` (a
    # label, an x- extension field) is data.
    patterns:
      - pattern: "include: $FILES"
      - pattern-not-inside: |
          $PARENT:
            ...
            include: $FILES
            ...

  - id: compose-bridge-net-member
    languages: [yaml]
    severity: ERROR
    message: >-
      Service `$SVC` joins bridge-net. Only protonmail-bridge and mbsync
      may reach Bridge (AGENTS.md: mbsync is the only container that
      talks to Bridge IMAP; indexer and mcp-server get no access).
    paths:
      include:
        - "docker-compose*.yml"
        - "docker-compose*.yaml"
        - "compose*.yml"
        - "compose*.yaml"
      exclude:
        - ".semgrep/"
    patterns:
      - pattern-either:
          - pattern-inside: |
              services:
                ...
                $SVC:
                  ...
                  networks: [..., bridge-net, ...]
                  ...
                ...
          - pattern-inside: |
              services:
                ...
                $SVC:
                  ...
                  networks:
                    ...
                    bridge-net: $CFG
                    ...
                  ...
                ...
      - pattern: |
          $SVC:
            ...
      - metavariable-regex:
          metavariable: $SVC
          regex: ^(?!(protonmail-bridge|mbsync)$)

  # ---------------------------------------------------------------------------
  # Required hardening for every defined service (one that names a build
  # or an image).
  # ---------------------------------------------------------------------------
  - id: compose-service-missing-read-only
    languages: [yaml]
    severity: ERROR
    message: >-
      Service `$SVC` does not set `read_only: true`. Use a read-only root
      filesystem with tmpfs and volumes for the writable paths.
    paths:
      include:
        - "docker-compose*.yml"
        - "docker-compose*.yaml"
        - "compose*.yml"
        - "compose*.yaml"
      exclude:
        - ".semgrep/"
    patterns:
      - pattern-inside: |
          services:
            ...
      - pattern-either:
          - pattern: |
              $SVC:
                ...
                build: $BUILD
                ...
          - pattern: |
              $SVC:
                ...
                image: $IMAGE
                ...
      - pattern-not: |
          $SVC:
            ...
            read_only: true
            ...

  - id: compose-service-missing-no-new-privileges
    languages: [yaml]
    severity: ERROR
    message: >-
      Service `$SVC` does not set `security_opt: [no-new-privileges:true]`.
    paths:
      include:
        - "docker-compose*.yml"
        - "docker-compose*.yaml"
        - "compose*.yml"
        - "compose*.yaml"
      exclude:
        - ".semgrep/"
    patterns:
      - pattern-inside: |
          services:
            ...
      - pattern-either:
          - pattern: |
              $SVC:
                ...
                build: $BUILD
                ...
          - pattern: |
              $SVC:
                ...
                image: $IMAGE
                ...
      - pattern-not: |
          $SVC:
            ...
            security_opt: [..., "no-new-privileges:true", ...]
            ...

  - id: compose-service-missing-cap-drop-all
    languages: [yaml]
    severity: ERROR
    message: >-
      Service `$SVC` does not set `cap_drop: [ALL]`.
    paths:
      include:
        - "docker-compose*.yml"
        - "docker-compose*.yaml"
        - "compose*.yml"
        - "compose*.yaml"
      exclude:
        - ".semgrep/"
    patterns:
      - pattern-inside: |
          services:
            ...
      - pattern-either:
          - pattern: |
              $SVC:
                ...
                build: $BUILD
                ...
          - pattern: |
              $SVC:
                ...
                image: $IMAGE
                ...
      - pattern-not: |
          $SVC:
            ...
            cap_drop: [..., ALL, ...]
            ...

  - id: compose-service-missing-pids-limit
    languages: [yaml]
    severity: ERROR
    message: >-
      Service `$SVC` does not set `pids_limit`, so a fork bomb inside it
      can exhaust the host's process table.
    paths:
      include:
        - "docker-compose*.yml"
        - "docker-compose*.yaml"
        - "compose*.yml"
        - "compose*.yaml"
      exclude:
        - ".semgrep/"
    patterns:
      - pattern-inside: |
          services:
            ...
      - pattern-either:
          - pattern: |
              $SVC:
                ...
                build: $BUILD
                ...
          - pattern: |
              $SVC:
                ...
                image: $IMAGE
                ...
      - pattern-not: |
          $SVC:
            ...
            pids_limit: $LIMIT
            ...

  - id: compose-service-missing-logging
    languages: [yaml]
    severity: ERROR
    message: >-
      Service `$SVC` does not set `logging`, so it inherits the daemon's
      log policy, which on stock json-file is unbounded (#484). Use
      `logging: *default-logging`.
    paths:
      include:
        - "docker-compose*.yml"
        - "docker-compose*.yaml"
        - "compose*.yml"
        - "compose*.yaml"
      exclude:
        - ".semgrep/"
    patterns:
      - pattern-inside: |
          services:
            ...
      - pattern-either:
          - pattern: |
              $SVC:
                ...
                build: $BUILD
                ...
          - pattern: |
              $SVC:
                ...
                image: $IMAGE
                ...
      - pattern-not: |
          $SVC:
            ...
            logging: $LOGGING
            ...
