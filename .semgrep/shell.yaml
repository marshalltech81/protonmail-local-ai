# Semgrep rules for the shell scripts (**/*.sh). shellcheck in lint.yml
# covers correctness and quoting; these rules cover the security
# conventions it does not check: AGENTS.md "TLS and connection security
# constraints", "Secret Handling" and the hardening rules as they apply
# to scripts.
#
# The rules are line regexes (`languages: [regex]`) rather than bash
# patterns: Semgrep's bash parser rejects several of the repo's scripts
# (validate-env.sh, bridge/tests/entrypoint_test.sh, part of
# mbsync/entrypoint.sh), and a structural rule silently skips what it
# cannot parse. A regex reads every line. `^[^#\n]*` before each match
# keeps commented-out lines from counting.
#
# Tests: .semgrep/shell.sh (run `semgrep test .semgrep`).
rules:
  - id: shell-tls-verification-disabled
    languages: [regex]
    severity: ERROR
    message: >-
      This disables TLS certificate verification. AGENTS.md treats a TLS
      bypass as a security regression; fail closed instead.
    paths:
      include:
        - "*.sh"
      exclude:
        - ".semgrep/"
    pattern-either:
      # curl -k / --insecure, alone or in a group of short flags.
      - pattern-regex: (?m)^[^#\n]*\bcurl\b[^#\n]*\s(-[a-zA-Z]*k[a-zA-Z]*|--insecure)(\s|$)
      - pattern-regex: (?m)^[^#\n]*\bwget\b[^#\n]*\s--no-check-certificate\b
      # git -c http.sslVerify=false, git config http.sslVerify false
      - pattern-regex: (?mi)^[^#\n]*\bhttp\.sslverify["']?[\s=]+["']?(false|0|no|off)\b
      # Environment switches that turn verification off for git, Python
      # and Node.
      - pattern-regex: (?m)^[^#\n]*\b(GIT_SSL_NO_VERIFY=["']?[^"'\s]|PYTHONHTTPSVERIFY=["']?0|NODE_TLS_REJECT_UNAUTHORIZED=["']?0)

  - id: shell-xtrace-enabled
    languages: [regex]
    severity: ERROR
    message: >-
      xtrace prints every command after expansion, including secrets read
      from Docker secrets or the environment, to stderr and so into the
      container log. AGENTS.md: never print secrets to logs.
    paths:
      include:
        - "*.sh"
      exclude:
        - ".semgrep/"
    pattern-either:
      - pattern-regex: (?m)^[^#\n]*\bset\s+(-[a-zA-Z]*x[a-zA-Z]*|-o\s+xtrace)(\s|;|$)
      - pattern-regex: (?m)^[^#\n]*\b(ba)?sh\s+-[a-zA-Z]*x[a-zA-Z]*(\s|$)
      - pattern-regex: \A#![^\n]*\s-[a-zA-Z]*x

  - id: shell-pipe-to-shell
    languages: [regex]
    severity: ERROR
    message: >-
      Piping a download into a shell runs unpinned, unverified code.
      Download to a file, verify a pinned checksum, then run it.
    paths:
      include:
        - "*.sh"
      exclude:
        - ".semgrep/"
    pattern-either:
      - pattern-regex: (?m)^[^#\n]*\b(curl|wget)\b[^#\n|]*\|\s*(sudo\s+)?(ba|z|da)?sh\b
      - pattern-regex: (?m)^[^#\n]*(\b(ba|z|da)?sh|\bsource|\.)\s+<\(\s*(curl|wget)\b

  - id: shell-world-writable
    languages: [regex]
    severity: ERROR
    message: >-
      This mode makes the path writable by every user. Grant write access
      to the owning service account only.
    paths:
      include:
        - "*.sh"
      exclude:
        - ".semgrep/"
    pattern-either:
      - pattern-regex: (?m)^[^#\n]*\bchmod\s+(-[a-zA-Z]+\s+)*["']?([0-7]?[0-7]{2}[2367]|[ugo]*[ao][ugoa]*[+=][rwxXst]*w[rwxXst]*)["']?(\s|$)
      - pattern-regex: (?m)^[^#\n]*\b(mkdir|install)\b[^#\n]*\s-m\s*["']?([0-7]?[0-7]{2}[2367]|[ugo]*[ao][ugoa]*[+=][rwxXst]*w[rwxXst]*)["']?(\s|$)
