[project]
name = "protonmail-local-ai-indexer"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "html2text==2025.4.15",
    "sqlite-vec==0.1.9",
    "watchdog==6.0.0",
    "tenacity==9.1.4",
    # Official OpenAI SDK for the operator-supplied OpenAI-compatible
    # ``/v1/embeddings`` endpoint. Operator-supplied compat servers
    # (LM Studio / vLLM / mlx_lm.server / TEI / DeepInfra / OpenRouter)
    # target the SDK as their reference client by design, so pointing
    # the SDK at them via ``base_url`` is the supported path.
    "openai==3.26.0",
    # Real BPE tokenizer for chunk-size estimation. Counting chunk tokens
    # with a char-count heuristic undercounts CJK / URL / Base64 / code
    # text by 4-6×, producing chunks that blow past the embed model's
    # context. The tokenizer.json bundled under ``src/data/qwen3-embedding/``
    # is the upstream HuggingFace tokenizer for ``Qwen/Qwen3-Embedding-8B``
    # (the schema-default embedding model). If the embed model is
    # changed, the bundled tokenizer file must be updated to match.
    "tokenizers==0.23.2",
    # Attachment text extraction. Each library is required
    # by exactly one extractor module under src/extractors/; lazy import
    # there means a missing one downgrades to ``unsupported`` rather
    # than crashing the indexer.
    "pypdf==6.19.0",               # digital PDF text layer
    "cryptography==50.0.2",        # pypdf AES decryption (owner-password-only PDFs)
    "pdf2image==1.17.0",           # render PDF pages → PIL.Image (needs Poppler)
    "pytesseract==0.3.13",         # OCR via Tesseract binary
    "pillow==12.3.0",              # image loading + EXIF rotation for OCR
    "pillow-heif==1.8.0",          # HEIC/HEIF opener for Pillow (bundles libheif + libde265)
    "python-docx==1.2.0",          # DOCX paragraph + table walk
    "openpyxl==3.1.5",             # XLSX read-only workbook walk
    "python-pptx==1.0.2",          # PPTX slide shape + notes walk
    "xlrd==2.0.2",                 # legacy binary .xls (OLE2) workbook read
    "defusedxml==0.7.1",           # XML-bomb defense for python-docx + openpyxl
]

[dependency-groups]
dev = [
    # httpx2 is only imported by tests (transport stubs for the openai
    # SDK); the runtime gets it transitively via openai.
    "httpx2==2.13.1",
    "mypy==2.4.0",
    # Reads OLE2 SummaryInformation (Author, Last Saved By) in
    # tests/test_fixture_authors.py (#980); no runtime dependency reads
    # OLE2 property sets.
    "olefile==0.47",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "defusedxml.*",
    "openpyxl.*",
    "pytesseract.*",
    "sqlite_vec.*",
    "tokenizers.*",
    "xlrd.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "real_extractor_child: start the real extractor child process for the OOXML, image and PDF extractors (tests/conftest.py)",
]
addopts = "-v --tb=short --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=90"
filterwarnings = [
    # ``defusedxml`` emits this DeprecationWarning at import time of its
    # internal ``cElementTree`` shim. We pin defusedxml as a transitive
    # XML-bomb defense for python-docx + openpyxl and do not import the
    # deprecated submodule ourselves; the warning is third-party noise we
    # cannot fix without dropping the dependency. Filter it specifically
    # rather than blanket-ignoring DeprecationWarning so a future
    # deprecation in our own code still surfaces.
    "ignore:defusedxml.cElementTree is deprecated:DeprecationWarning",
    # An unclosed sqlite3 connection (or file) fails the suite (#1110).
    # Python ignores ResourceWarning by default, so the first line makes
    # it raise; a leak the garbage collector finalizes then surfaces as an
    # unraisable exception, which pytest reports only as a warning unless
    # the second line makes that an error too.
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["src"]
# src/main.py counts (#757): it holds the two-phase indexing pipeline
# as well as the service bootstrap, and tests/test_main.py exercises it.
omit = [
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
