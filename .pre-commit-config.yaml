repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']
        # Bundled embedding-model tokenizers are intentional source data,
        # not accidental binary commits. The Qwen3-Embedding-8B BPE
        # tokenizer is ~11 MB and ships with the indexer image so
        # ``estimate_tokens`` never needs network at startup.
        exclude: '^indexer/src/data/.*/tokenizer\.json$'
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Hadolint v2.15.1, pinned by digest to the image the hadolint job in
  # .github/workflows/lint.yml uses (hadolint-action v3.5.0's Dockerfile).
  # The upstream remote hook pulls ghcr.io/hadolint/hadolint untagged, i.e.
  # :latest (#736). Dependabot does not track a local hook: bump the tag and
  # digest by hand with each hadolint upgrade. Ignored rules and why are in
  # .hadolint.yaml, which hadolint reads from the repository root.
  - repo: local
    hooks:
      - id: hadolint-docker
        name: Lint Dockerfiles
        language: docker_image
        types: [dockerfile]
        entry: ghcr.io/hadolint/hadolint:v2.15.1-debian@sha256:9a3944b7fddcb947d1ffd90829ac1a6e5c30479223358f249d8b96c7d0019e27 hadolint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "0.26"
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '\.env\.example$'

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ['-r', 'indexer/src', 'mcp-server/src', '--severity-level', 'medium']
        pass_filenames: false
