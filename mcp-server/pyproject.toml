[project]
name = "protonmail-local-ai-mcp-server"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    # Standalone FastMCP (jlowin/Prefect): the server framework and its
    # Streamable HTTP app.
    "fastmcp==4.0.11",
    # ``fastmcp`` accepts any ``mcp`` 2.x. The tool code imports
    # ``mcp.types`` and ``main.py`` the SDK's Host/Origin validator
    # directly, so pin the version fastmcp 4.0.10 resolves.
    "mcp==2.3.0",
    "uvicorn==0.54.0",
    "starlette==1.7.0",
    "sqlite-vec==0.1.9",
    # Inference, embed, and rerank SDKs. ``openai`` covers both
    # ``INFERENCE_MODE=openai`` (chat completions) and ``EMBED_MODE=openai``
    # (the ``/v1/embeddings`` wire format every operator-supplied compat
    # server — LM Studio, vLLM, mlx_lm.server, TEI, DeepInfra,
    # OpenRouter — already speaks). The embed client is a thin wrapper
    # around ``AsyncOpenAI`` so the project does not maintain its own
    # HTTP/retry plumbing for a wire format the SDK already handles.
    "openai==3.24.0",
    "anthropic==1.11.0",
    "cohere==7.2.0",
    # Output models for structured tool results (``src/tools/outputs.py``).
    # Pinned to a version ``fastmcp`` and ``mcp`` accept; declared
    # because the tool code imports it directly.
    "pydantic==2.13.5",
    # The HTTP client fastmcp's Streamable HTTP transport uses; already
    # locked through ``fastmcp``. Declared at that version because
    # ``src/stdio_adapter.py`` builds its client directly.
    "httpx2==2.13.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
# ``tests/eval`` is the opt-in retrieval-quality harness — it requires a
# real indexed mailbox via ``MCP_EVAL_DB`` and is excluded from the
# default collection so the regular suite stays self-contained. Run it
# with ``pytest -o addopts= -m eval tests/eval -s`` (see its README).
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=90 --ignore=tests/eval"
markers = [
    "eval: opt-in retrieval-quality eval against a real mailbox (skipped by default; run with `pytest -o addopts= -m eval tests/eval -s`)",
    "baseline: retrieval regression baseline over the synthetic mailbox (skipped unless BASELINE_DIR is set; run with `make baseline`)",
]

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "sqlite_vec.*",
]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
# Coverage scope is the full mcp-server package. Tool handlers run
# against a FakeMCPServer stub (see ``tests/conftest.py::FakeMCPServer``)
# so handler logic is exercised without standing up the real FastMCP
# transport. ``src/main.py`` counts too (#757): its auth and app wiring
# (``_build_app``, the bearer-token verifier, the Host/Origin guard) and
# helpers are unit-tested directly, so a gap there shows in the figure.
source = ["src"]
omit = [
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
