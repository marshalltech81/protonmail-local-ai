[project]
name = "protonmail-local-ai-mcp-server"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "mcp==1.28.1",
    "uvicorn==0.54.0",
    "starlette==1.3.1",
    "sqlite-vec==0.1.9",
    # Inference, embed, and rerank SDKs. ``openai`` covers both
    # ``INFERENCE_MODE=openai`` (chat completions) and ``EMBED_MODE=openai``
    # (the ``/v1/embeddings`` wire format every operator-supplied compat
    # server — LM Studio, vLLM, mlx_lm.server, TEI, DeepInfra,
    # OpenRouter — already speaks). The embed client is a thin wrapper
    # around ``AsyncOpenAI`` so the project does not maintain its own
    # HTTP/retry plumbing for a wire format the SDK already handles.
    "openai==3.19.2",
    "anthropic==1.8.0",
    "cohere==7.0.0",
    # Output models for structured tool results (``src/tools/outputs.py``).
    # Pinned to the version ``mcp`` already resolves; declared because the
    # tool code imports it directly.
    "pydantic==2.13.5",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
# ``tests/eval`` is the opt-in retrieval-quality harness — it requires a
# real indexed mailbox via ``MCP_EVAL_DB`` and is excluded from the
# default collection so the regular suite stays self-contained. Run it
# with ``pytest -o addopts= -m eval tests/eval -s`` (see its README).
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=90 --ignore=tests/eval"
markers = [
    "eval: opt-in retrieval-quality eval against a real mailbox (skipped by default; run with `pytest -o addopts= -m eval tests/eval -s`)",
    "baseline: retrieval regression baseline over the synthetic mailbox (skipped unless BASELINE_DIR is set; run with `make baseline`)",
]

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "sqlite_vec.*",
]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
# Coverage scope is the full mcp-server package. Tool handlers run
# against a FakeMCPServer stub (see ``tests/conftest.py::FakeMCPServer``)
# so handler logic is exercised without standing up the real FastMCP
# transport. ``src/main.py`` is excluded as a whole: it is the service
# bootstrap (env wiring, tool registration, ``server.run``), covered by
# docker-compose integration. Its helpers (``_env_bool``,
# ``_read_secret``, the ``/health`` route) are unit-tested directly but
# do not count toward the figure.
source = ["src"]
omit = [
    "tests/*",
    "src/main.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
