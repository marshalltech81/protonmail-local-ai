# Log rotation shared by every service: the json-file driver keeps at most
# three 10 MiB files per container. Without it a service inherits the
# daemon's policy, which on stock json-file is unbounded (#484).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ---------------------------------------------------------------------------
  # mbsync
  # Syncs email from the Proton Mail Bridge app's IMAP to local Maildir.
  #
  # Bridge is the official app running on the host, outside Compose; mbsync
  # reaches it through ``host.docker.internal``. The app stays bound to the
  # host's loopback interface; no port is published and no host networking
  # is used. Tested on macOS (OrbStack, Docker Desktop), where
  # host.docker.internal forwards to the host's loopback. Linux is not
  # supported: there host.docker.internal reaches the docker bridge
  # address, not the loopback the app listens on. See docs/setup.md.
  #
  # TLS: the app's certificate is issued for ``127.0.0.1`` only. isync
  # checks the certificate against the configured Host, so mbsync keeps
  # ``Host 127.0.0.1`` for verification and opens the TCP connection to
  # host.docker.internal through a ``Tunnel`` (socat). Implicit TLS (the
  # app's IMAP connection mode must be SSL, #638), certificate
  # verification and the persistent fingerprint pin apply, and the
  # certificate must also match BRIDGE_CERT_FINGERPRINT from .env on
  # every start. See docs/architecture.md ("Bridge").
  # ---------------------------------------------------------------------------
  mbsync:
    build:
      context: ./mbsync
    secrets:
      - bridge_pass
    container_name: mbsync
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    tmpfs:
      - /tmp
    # Bridge runs outside Compose, so there is no health check to wait for;
    # the entrypoint's bounded IMAP wait covers an app that is not running.
    environment:
      BRIDGE_HOST: host.docker.internal
      # The app's IMAP port, shown with its IMAP credentials.
      BRIDGE_IMAP_PORT: ${BRIDGE_IMAP_PORT:-1143}
      # The name the app's certificate is issued for (its CN). The
      # entrypoint verifies the certificate against this name and connects
      # to BRIDGE_HOST:BRIDGE_IMAP_PORT through a tunnel.
      BRIDGE_CERT_HOST: 127.0.0.1
      # Required: the SHA-256 fingerprint of the app's certificate, taken
      # on the host (docs/setup.md). Another local account could hold the
      # app's loopback port while it is down, so the first certificate is
      # never trusted on first use.
      BRIDGE_CERT_FINGERPRINT: ${BRIDGE_CERT_FINGERPRINT:-}
      BRIDGE_USER: ${BRIDGE_USER}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-60}
      # Per-run mbsync deadline (#282); see .env.example.
      SYNC_DEADLINE_SECONDS: ${SYNC_DEADLINE_SECONDS:-86400}
      # Set to true for one container creation when the app's TLS cert is
      # deliberately rotated (and BRIDGE_CERT_FINGERPRINT updated to it),
      # then recreate mbsync with it false: the value survives restarts of
      # the same container. mbsync refuses to sync on a fingerprint
      # mismatch otherwise. See docs/troubleshooting.md.
      BRIDGE_CERT_PIN_ROTATE: ${BRIDGE_CERT_PIN_ROTATE:-false}
    volumes:
      - maildir-volume:/maildir
      - mbsync-state:/state
    logging: *default-logging
    networks:
      - bridge-net

  # ---------------------------------------------------------------------------
  # Inference / embed / rerank are operator-supplied. Each layer has a
  # ``*_MODE`` env var (anthropic|openai|none, openai, cohere|none) plus
  # matching ``*_BASE_URL`` / ``*_MODEL`` / ``*_API_KEY``. Embed has no
  # disabled mode (semantic search is the headline feature and the
  # indexer cannot run without an embedder); ``INFERENCE_MODE=none``
  # skips intelligence-tool registration and ``RERANK_MODE=none``
  # disables the rerank stage. Missing required vars fail at startup
  # with no inter-mode fallback. Inference and rerank go through
  # official SDKs (openai, anthropic, cohere); embed uses the openai
  # SDK pointed at a custom ``base_url``. See .env.example for examples
  # and AGENTS.md for the full shape.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Indexer
  # Watches Maildir, parses and threads emails, generates embeddings,
  # and writes to the SQLite index (FTS5 + sqlite-vec).
  # ---------------------------------------------------------------------------
  indexer:
    build:
      context: ./indexer
    container_name: indexer
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    # Cap memory so a malicious attachment that slips past the
    # ``ZIP_MAX_UNCOMPRESSED_BYTES`` pre-check (e.g. a quadratic-blowup
    # XML payload that lxml expands in core) cannot pressure the host.
    # Peak memory scales with ``concurrency × largest_in_flight_message``
    # because parsed attachment text and per-chunk float vectors are
    # held in memory while waiting on embedder RPCs. Empirical tuning
    # history (May 2026 eval session, ~22k-message mailbox with
    # attachment-heavy threads):
    #
    #   - 1 GiB was too tight under normal indexing bursts.
    #   - 2 GiB OOM-killed 3 times during initial backfill.
    #   - 4 GiB OOM-killed 1 more time during the same backfill.
    #   - 6 GiB is the post-incident cap. Steady-state RSS will be
    #     much lower; this is sized for the backfill peak. The right
    #     long-term fix is throttling the indexer's parallel embed
    #     dispatch (peak memory scales with concurrency, not with the
    #     mailbox size) — see the eval recommendations for details.
    mem_limit: 6g
    tmpfs:
      - /tmp
      - /home/indexer:uid=1002,gid=1002,mode=700
    depends_on:
      mbsync:
        condition: service_healthy
    secrets:
      - embed_api_key
    environment:
      HOME: /home/indexer
      MAILDIR_PATH: /maildir
      SQLITE_PATH: /data/mail.db
      # OpenAI-compatible embedder via the openai SDK. EMBED_MODEL and
      # EMBED_API_KEY are required; EMBED_BASE_URL is optional and an
      # empty value selects the SDK default (``https://api.openai.com/v1``).
      # Set EMBED_BASE_URL to point at any other provider that speaks
      # /v1/embeddings (DeepInfra, OpenRouter, LM Studio, vLLM, TEI, or
      # a host-side mlx_lm.server). Indexer + mcp-server must point at
      # the same provider + model so vectors are comparable.
      # ``EMBED_MODE=openai`` is the only valid value.
      EMBED_MODE: ${EMBED_MODE:-openai}
      EMBED_BASE_URL: ${EMBED_BASE_URL}
      EMBED_MODEL: ${EMBED_MODEL}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-64}
      # Cross-message batch size for the initial-index drainer. See
      # .env.example for the two-phase pipeline that this tunes.
      INITIAL_INDEX_BATCH_SIZE: ${INITIAL_INDEX_BATCH_SIZE:-50}
      # Steady-state main-loop batch size. Smaller than the initial-scan
      # size because steady-state typically sees 1-3 messages per pass;
      # the value is the upper bound, not a target. Routing through the
      # batched path means a 5+ message mbsync burst still collapses
      # into one embed call.
      INDEXER_STEADY_STATE_BATCH_SIZE: ${INDEXER_STEADY_STATE_BATCH_SIZE:-8}
      # How often the main loop runs PRAGMA wal_checkpoint(TRUNCATE).
      # The single shared sqlite3 connection pins a WAL read snapshot for
      # the duration of the indexer process; without an explicit
      # truncate-checkpoint the WAL grows monotonically.
      INDEXER_WAL_CHECKPOINT_INTERVAL_SECS: ${INDEXER_WAL_CHECKPOINT_INTERVAL_SECS:-600}
      # How often the main loop re-runs the chunkless-zero-vector
      # recovery sweep. Both startup and periodic sweeps respect the
      # dead-letter boundary — neither auto-resurrects dead-lettered
      # rows. To rescue a dead-lettered file, an operator confirms
      # the underlying cause is fixed and either deletes the dead
      # row (the next sweep then sees the no-row state and re-enqueues)
      # or runs `make requeue-dead` to send dead rows back through
      # the queue. See
      # indexer/src/main.py:_recover_zero_vector_threads for the
      # full policy and rescue paths.
      INDEXER_RECOVERY_SWEEP_INTERVAL_SECS: ${INDEXER_RECOVERY_SWEEP_INTERVAL_SECS:-1800}
      # Queue retry policy: max attempts before dead-letter, and the
      # base backoff doubled per attempt (capped at 6h in queue.py).
      INDEXER_MAX_ATTEMPTS: ${INDEXER_MAX_ATTEMPTS:-5}
      INDEXER_RETRY_BASE_SECONDS: ${INDEXER_RETRY_BASE_SECONDS:-30}
      # Stall guard: exit (and let the restart policy bring the indexer
      # back) when one message's parse, or one attachment's extraction,
      # runs this long. 0 disables it.
      INDEXER_MESSAGE_TIMEOUT_SECONDS: ${INDEXER_MESSAGE_TIMEOUT_SECONDS:-3600}
      # Warmup POST timeout for the first embed call after container
      # start: a per-operation HTTP timeout (each connect, read or
      # write must make progress within it), not a total-call
      # deadline. Default 600s absorbs cold-start latency on host-side
      # providers; lower it on warm caches or fast remote endpoints
      # for faster startup-failure detection.
      EMBED_WARMUP_TIMEOUT_SECS: ${EMBED_WARMUP_TIMEOUT_SECS:-600}
      # Chunker token budgets. Defaults are sized for Qwen3-Embedding-8B's
      # long context window — fewer, larger chunks mean fewer embed
      # round-trips and better mean-of-chunks thread vectors.
      INDEXER_CHUNK_TARGET_TOKENS: ${INDEXER_CHUNK_TARGET_TOKENS:-1000}
      INDEXER_CHUNK_MAX_TOKENS: ${INDEXER_CHUNK_MAX_TOKENS:-1500}
      INDEXER_CHUNK_OVERLAP_TOKENS: ${INDEXER_CHUNK_OVERLAP_TOKENS:-150}
      # Deletion reconciliation — on by default (mirror); set false for
      # archive. See .env.example for details.
      INDEXER_DELETION_ENABLED: ${INDEXER_DELETION_ENABLED:-true}
      INDEXER_DELETION_GRACE_DAYS: ${INDEXER_DELETION_GRACE_DAYS:-7}
      INDEXER_DELETION_SWEEP_INTERVAL_SECS: ${INDEXER_DELETION_SWEEP_INTERVAL_SECS:-3600}
      INDEXER_DELETION_MAX_BATCH_PCT: ${INDEXER_DELETION_MAX_BATCH_PCT:-0.05}
      INDEXER_DELETION_FORCE: ${INDEXER_DELETION_FORCE:-false}
      INDEXER_UNLINK_ON_REAP: ${INDEXER_UNLINK_ON_REAP:-false}
      # Attachment extraction knobs. Code defaults already match these
      # values; explicit wiring is here so operator overrides in .env
      # actually reach the container env (otherwise compose interpolates
      # them only into its own substitution scope, never into os.environ
      # inside the indexer process).
      INDEXER_ATTACHMENT_EXTRACTION_ENABLED: ${INDEXER_ATTACHMENT_EXTRACTION_ENABLED:-true}
      INDEXER_OCR_ENABLED: ${INDEXER_OCR_ENABLED:-true}
      INDEXER_ATTACHMENT_MAX_BYTES: ${INDEXER_ATTACHMENT_MAX_BYTES:-33554432}
      INDEXER_OCR_MAX_PAGES: ${INDEXER_OCR_MAX_PAGES:-20}
      INDEXER_OCR_TIMEOUT_SECONDS: ${INDEXER_OCR_TIMEOUT_SECONDS:-60}
      INDEXER_PDF_MAX_DIGITAL_PAGES: ${INDEXER_PDF_MAX_DIGITAL_PAGES:-500}
      INDEXER_ATTACHMENT_MAX_EXTRACTED_CHARS: ${INDEXER_ATTACHMENT_MAX_EXTRACTED_CHARS:-2000000}
      # Per-message parse byte cap. Files larger than this are rejected
      # with a dead-letter row rather than read into memory; sized below
      # the container ``mem_limit`` so a single oversized message
      # cannot OOM the indexer. ``0`` disables the cap. The default
      # matches indexer/src/parser.py; this passthrough is required
      # because compose does not propagate operator overrides in
      # ``.env`` into ``os.environ`` inside the container without an
      # explicit binding.
      INDEXER_PARSE_MAX_BYTES: ${INDEXER_PARSE_MAX_BYTES:-50000000}
    volumes:
      # Maildir is mounted read-only by default: the indexer's job is to read
      # .eml files and build the SQLite index. INDEXER_UNLINK_ON_REAP needs
      # write access to actually remove reaped files; with the default ro
      # mount the unlink call logs a warning and the index still cleans up
      # correctly, the files just stay on disk.
      - maildir-volume:/maildir:ro
      - sqlite-volume:/data
      # Operator config, read-only. The indexer reads the optional
      # source-authority rules at the fixed path /config/authority.toml;
      # see config/authority.toml.example.
      # The directory is mounted rather than the file, so an absent file
      # stays absent instead of Docker creating a directory in its place.
      - ./config:/config:ro
    logging: *default-logging
    networks:
      - app-net

  # ---------------------------------------------------------------------------
  # MCP Server
  # Exposes search, Q&A, and agentic tools over MCP transports.
  # Accessible on the host machine only. Streamable HTTP is the only
  # transport: http://127.0.0.1:MCP_PORT/mcp. Every /mcp request must send
  # Authorization: Bearer <the mcp_auth_token secret>; /health is open.
  # ---------------------------------------------------------------------------
  mcp-server:
    build:
      context: ./mcp-server
    container_name: mcp-server
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    tmpfs:
      - /tmp
    depends_on:
      indexer:
        condition: service_healthy
    secrets:
      - inference_api_key
      - embed_api_key
      - rerank_api_key
      - mcp_auth_token
    environment:
      SQLITE_PATH: /data/mail.db
      # INFERENCE_MODE selects the inference client/SDK. For any enabled
      # mode INFERENCE_MODEL and INFERENCE_API_KEY are required;
      # INFERENCE_BASE_URL is optional and an empty value selects the
      # SDK's documented default.
      # - anthropic (default): Anthropic Messages API via the official
      #   anthropic SDK. Empty INFERENCE_BASE_URL -> api.anthropic.com.
      # - openai: OpenAI-compatible chat completions via the official
      #   openai SDK. Empty INFERENCE_BASE_URL -> api.openai.com/v1;
      #   set it for any other provider or a host-side server.
      # - none: intelligence tools are not registered.
      INFERENCE_MODE: ${INFERENCE_MODE:-anthropic}
      INFERENCE_BASE_URL: ${INFERENCE_BASE_URL}
      INFERENCE_MODEL: ${INFERENCE_MODEL:-claude-sonnet-4-6}
      # Per-operation HTTP timeout for inference completions (seconds):
      # each connect, read or write must make progress within it; it
      # is not a total-call deadline. Default 300 absorbs
      # reasoning-heavy prompts; raise it for slow remote providers or
      # on-host models in thinking mode.
      INFERENCE_TIMEOUT_SECS: ${INFERENCE_TIMEOUT_SECS:-300}
      # Output token cap. Required by the Anthropic Messages API; the
      # OpenAI Chat Completions API accepts it too and most compatible
      # servers (vLLM, mlx_lm.server, LM Studio, DeepInfra) honor it.
      # Default 1024 fits "brief" / "action-items" summaries; raise
      # for "detailed" summaries on long threads or for
      # extract_from_emails over rich schemas.
      INFERENCE_MAX_TOKENS: ${INFERENCE_MAX_TOKENS:-1024}
      # Model context window in tokens; prompts plus INFERENCE_MAX_TOKENS
      # of reply are fitted into it. Set a small local model's window.
      INFERENCE_CONTEXT_TOKENS: ${INFERENCE_CONTEXT_TOKENS:-32768}
      MCP_PORT: ${MCP_PORT:-3000}
      # Only "streamable-http" (or empty) is accepted. Still passed through
      # so an old .env with the removed "sse" or "dual" fails startup with
      # migration steps instead of being ignored.
      MCP_TRANSPORT: ${MCP_TRANSPORT:-streamable-http}
      # Seconds a Streamable HTTP session may sit idle before the server
      # ends it, so a session a client abandons does not hold a server
      # task until restart.
      MCP_SESSION_IDLE_TIMEOUT_SECS: ${MCP_SESSION_IDLE_TIMEOUT_SECS:-1800}
      # "true" registers the experimental tools (brief_issue and
      # check_conclusion; both need inference); their output format may
      # change. Any value other than true / false / empty fails startup.
      MCP_EXPERIMENTAL_TOOLS: ${MCP_EXPERIMENTAL_TOOLS:-false}
      # OpenAI-compatible embedder for query-time embedding via the
      # openai SDK. Must point at the same provider + model as the
      # indexer; otherwise query and indexed vectors are produced by
      # different models and hybrid search degrades.
      EMBED_MODE: ${EMBED_MODE:-openai}
      EMBED_BASE_URL: ${EMBED_BASE_URL}
      EMBED_MODEL: ${EMBED_MODEL}
      # Per-operation HTTP timeout for query-time embed (seconds): each
      # connect, read or write must make progress within it; it is not
      # a total-call deadline. Default 60s is generous headroom over
      # Qwen3-Embedding-8B's sub-second steady-state. Cold-start in the indexer is governed separately
      # by EMBED_WARMUP_TIMEOUT_SECS — operator overrides reach this
      # var here and the warmup constant in the indexer service block.
      EMBED_TIMEOUT_SECS: ${EMBED_TIMEOUT_SECS:-60}
      # Cross-encoder rerank stage in hybrid search. ``RERANK_MODE=cohere``
      # enables Cohere's rerank API via the official cohere SDK;
      # ``RERANK_MODE=none`` (default) returns RRF order directly.
      # RERANK_CANDIDATES governs how many RRF results are fed to the
      # cross-encoder before truncation to the caller's ``limit``.
      RERANK_MODE: ${RERANK_MODE:-none}
      RERANK_BASE_URL: ${RERANK_BASE_URL}
      RERANK_MODEL: ${RERANK_MODEL}
      RERANK_CANDIDATES: ${RERANK_CANDIDATES:-20}
      # Per-operation HTTP timeout for the Cohere rerank API (seconds):
      # each connect, read or write must make progress within it; it
      # is not a total-call deadline. Default 60 s is shorter than the
      # SDK's 300 s default so a stalled rerank call doesn't pin a
      # hybrid_search worker thread for five minutes; rerank failures
      # fall back to RRF order so a tighter timeout is safe.
      RERANK_TIMEOUT_SECS: ${RERANK_TIMEOUT_SECS:-60}
    volumes:
      # Mounted writable so SQLite can create the WAL ``-shm`` sidecar needed
      # for readers on a WAL-mode database. The mcp-server process opens the
      # DB via the ``?mode=ro`` URI and enforces ``PRAGMA query_only`` so the
      # connection cannot mutate the index — a writable mount plus an
      # application-level read-only connection preserves read-only semantics
      # without blocking WAL reads.
      - sqlite-volume:/data
    ports:
      # Same port on both sides: the server binds MCP_PORT inside the
      # container (and its healthcheck probes MCP_PORT), so mapping the
      # host port to a fixed container port would point at nothing.
      - "127.0.0.1:${MCP_PORT:-3000}:${MCP_PORT:-3000}"
    logging: *default-logging
    networks:
      - app-net
    # Healthcheck is defined in mcp-server/Dockerfile and inherited here.

# =============================================================================
# Volumes
# All email data and indexes live in named Docker volumes.
# Back up sqlite-volume to preserve your search index.
# =============================================================================
volumes:
  maildir-volume:    # Raw email in Maildir format
  mbsync-state:      # Persistent mbsync state (pinned Bridge cert fingerprint)
  sqlite-volume:     # SQLite database (FTS5 + vector index)

# =============================================================================
# Networks
# mbsync's traffic to the Bridge app is isolated from the application network.
# Only the MCP server port is exposed to the host (localhost only).
# =============================================================================
networks:
  bridge-net:
    driver: bridge
  app-net:
    driver: bridge

secrets:
  bridge_pass:
    file: ./.secrets/bridge_pass.txt
  # Inference API key — required (non-empty) whenever INFERENCE_MODE
  # != none. For unauthenticated host-side OpenAI-compatible servers
  # (LM Studio, vLLM, mlx_lm.server) write any placeholder string
  # (e.g. ``unauthenticated``); the compat server ignores the bearer
  # header. Leave the file empty only when INFERENCE_MODE=none.
  # Never put this value in .env (it appears in docker inspect output).
  inference_api_key:
    file: ./.secrets/inference_api_key.txt
  # Embed API key — always required non-empty because EMBED_MODE has
  # no ``none`` mode (the indexer cannot run without an embedder).
  # Use any placeholder string (e.g. ``unauthenticated``) when
  # pointing at an unauthenticated host server.
  embed_api_key:
    file: ./.secrets/embed_api_key.txt
  # Rerank API key — required when RERANK_MODE=cohere. Leave the file
  # empty when RERANK_MODE=none.
  rerank_api_key:
    file: ./.secrets/rerank_api_key.txt
  # MCP bearer token — required (non-empty). Every /mcp request must
  # send ``Authorization: Bearer <token>``; mcp-server fails startup
  # without it. ``make init-secrets`` generates one. Never put this
  # value in .env (MCP_AUTH_TOKEN is only for runs outside a container).
  mcp_auth_token:
    file: ./.secrets/mcp_auth_token.txt
