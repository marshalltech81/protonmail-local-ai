version: 2

# Labels follow the repository scheme (PLAN.md, Notes for Agents):
# `dependencies` is the type, the second label is the area the update
# lands in. The ecosystem labels (python, docker, java, pre-commit,
# github-actions) were retired on 2026-10-07.

updates:
  # Repo-level tooling
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, area/ci]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, area/docker]

  # indexer Python dependencies
  - package-ecosystem: uv
    directory: /indexer
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, area/indexer]

  # mcp-server Python dependencies
  - package-ecosystem: uv
    directory: /mcp-server
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, area/mcp-server]

  # indexer Java libraries for the legacy .ppt reader (#957). POI's two
  # artifacts share a version, so they move together. A bump also needs
  # indexer/java/checksums/checksums.sha256 rewritten with
  # `make ppt-checksums` and committed to the PR (#1117): the builds
  # check every artifact against it and fail until then.
  - package-ecosystem: maven
    directory: /indexer/java
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, area/extractors]
    groups:
      apache-poi:
        patterns: ["org.apache.poi:*"]

  # Docker base images
  - package-ecosystem: docker
    directory: /mbsync
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, area/docker]

  - package-ecosystem: docker
    directory: /indexer
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, area/docker]

  - package-ecosystem: docker
    directory: /mcp-server
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, area/docker]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, area/ci]
