version: 2

# Labels follow the repository scheme (AGENTS.md, "Issue Conventions"):
# `dependencies` is the type, the second label is the area the update
# lands in. The ecosystem labels (python, docker, java, pre-commit,
# github-actions) were retired on 2026-10-07.
#
# Version updates are grouped where the files they touch are the same, so a
# week brings one pull request per group instead of one per dependency.
# Only minor and patch updates are grouped: a major upgrade arrives on its
# own pull request, so a breaking change cannot hide inside a grouped one.
# Docker updates stay one per image, because each base-image digest moves
# with the other two (scripts/tests/image_pin_test.sh) and a group cannot
# span directories.
#
# Every ecosystem waits 7 days after a release before proposing it
# (`cooldown`): a compromised or yanked release is usually caught inside
# that window. Security updates ignore the cooldown and the grouping, and
# open on their own pull request as soon as an advisory is published.

updates:
  # Repo-level tooling
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      pre-commit-hooks:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, area/ci]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels: [dependencies, area/docker]

  # indexer Python dependencies
  - package-ecosystem: uv
    directory: /indexer
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      indexer-python:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, area/indexer]

  # mcp-server Python dependencies
  - package-ecosystem: uv
    directory: /mcp-server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      mcp-server-python:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, area/mcp-server]

  # indexer Java libraries for the legacy .ppt reader (#957). POI's two
  # artifacts share a version, so they move together. A bump also needs
  # indexer/java/checksums/checksums.sha256 rewritten with
  # `make ppt-checksums` and committed to the PR (#1117): the builds
  # check every artifact against it and fail until then.
  - package-ecosystem: maven
    directory: /indexer/java
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels: [dependencies, area/extractors]
    groups:
      apache-poi:
        patterns: ["org.apache.poi:*"]

  # Docker base images
  - package-ecosystem: docker
    directory: /mbsync
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels: [dependencies, area/docker]

  - package-ecosystem: docker
    directory: /indexer
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels: [dependencies, area/docker]

  - package-ecosystem: docker
    directory: /mcp-server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels: [dependencies, area/docker]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, area/ci]
