name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel a pull request's in-progress run when a newer push supersedes it.
# Every other event gets its own group (the run ID), so runs on main,
# scheduled runs and manual dispatches never queue behind or cancel one
# another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mbsync-entrypoint:
    name: mbsync entrypoint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run entrypoint tests
        run: bash mbsync/tests/entrypoint_test.sh

  mbsync-tls:
    name: mbsync TLS check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the TLS check against a synthetic Bridge
        run: bash mbsync/tests/tls_check.sh

  mbsync-layout:
    name: mbsync layout check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the Maildir layout check with synthetic stores
        run: bash mbsync/tests/layout_check.sh

  compose-rendering:
    name: Compose rendering
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Compose rendering tests
        run: bash scripts/tests/compose_test.sh

  bridge-entrypoint:
    name: Bridge entrypoint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run entrypoint tests
        run: bash bridge/tests/entrypoint_test.sh

      - name: Run patch-source tests
        run: bash bridge/tests/patch_source_test.sh

  bridge-smoke-script:
    name: bridge smoke script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run bridge-smoke.sh tests
        run: bash scripts/tests/bridge_smoke_test.sh

  validate-env-script:
    name: validate-env script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run validate-env.sh tests
        run: bash scripts/tests/validate_env_test.sh

      - name: Run mcp-auth-headers.sh tests
        run: bash scripts/tests/mcp_auth_headers_test.sh

  indexer-pytest:
    name: indexer pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.6"
          enable-cache: true
          cache-dependency-glob: "indexer/uv.lock"

      - name: Sync indexer environment
        working-directory: indexer
        run: uv sync --locked --dev

      - name: Run pytest with coverage
        working-directory: indexer
        run: uv run pytest -q --cov-report=xml:coverage.xml --cov-report=term

      - name: Upload indexer coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: indexer-coverage
          path: indexer/coverage.xml
          if-no-files-found: error
          retention-days: 14

  mcp-server-pytest:
    name: mcp-server pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.6"
          enable-cache: true
          cache-dependency-glob: "mcp-server/uv.lock"

      - name: Sync mcp-server environment
        working-directory: mcp-server
        run: uv sync --locked --dev

      - name: Run pytest with coverage
        working-directory: mcp-server
        run: uv run pytest -q --cov-report=xml:coverage.xml --cov-report=term

      - name: Upload mcp-server coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-server-coverage
          path: mcp-server/coverage.xml
          if-no-files-found: error
          retention-days: 14

  retrieval-baseline:
    # Step 1 indexes the synthetic mailbox with the real indexer and a
    # hashed embedder; step 2 checks the golden questions and the rank
    # snapshot through mcp-server's read path. See `make baseline`.
    name: retrieval baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.6"
          enable-cache: true
          cache-dependency-glob: |
            indexer/uv.lock
            mcp-server/uv.lock

      - name: Sync environments
        run: |
          (cd indexer && uv sync --locked --dev)
          (cd mcp-server && uv sync --locked --dev)

      - name: Build baseline index
        working-directory: indexer
        run: uv run python -m tests.baseline.build "$RUNNER_TEMP/baseline" ../mcp-server/tests/baseline/golden.json

      - name: Check golden questions and rank snapshot
        working-directory: mcp-server
        env:
          BASELINE_DIR: ${{ runner.temp }}/baseline
        run: uv run pytest -q --no-cov tests/baseline
