name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel a pull request's in-progress run when a newer push supersedes it.
# Every other event gets its own group (the run ID), so runs on main,
# scheduled runs and manual dispatches never queue behind or cancel one
# another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mbsync-entrypoint:
    name: mbsync entrypoint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run entrypoint tests
        run: bash mbsync/tests/entrypoint_test.sh

  mbsync-tls:
    name: mbsync TLS check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the TLS check against a synthetic Bridge
        run: bash mbsync/tests/tls_check.sh

  mbsync-layout:
    name: mbsync layout check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the Maildir layout check with synthetic stores
        run: bash mbsync/tests/layout_check.sh

  compose-rendering:
    name: Compose rendering
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Compose rendering tests
        run: bash scripts/tests/compose_test.sh

  validate-env-script:
    name: validate-env script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run validate-env.sh tests
        run: bash scripts/tests/validate_env_test.sh

      - name: Run mcp-auth-headers.sh tests
        run: bash scripts/tests/mcp_auth_headers_test.sh

      - name: Run make status tests
        run: bash scripts/tests/make_status_test.sh

      - name: Run backup-index and restore-index tests
        run: bash scripts/tests/index_backup_test.sh

      - name: Run image pin tests
        run: bash scripts/tests/image_pin_test.sh

      - name: Run the Trivy flag checks
        run: bash scripts/tests/trivy_flags_test.sh

      - name: Run the Maven trusted-checksum checks
        run: bash scripts/tests/maven_checksums_test.sh

  indexer-pytest:
    name: indexer pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: "indexer/uv.lock"

      - name: Sync indexer environment
        working-directory: indexer
        run: uv sync --locked --dev

      # catdoc runs the legacy .doc extractor, as in indexer/Dockerfile
      # (#935). Its tests skip only off CI: test_catdoc_is_installed_in_ci
      # fails here if the binary is missing. Tesseract and Poppler run
      # the OCR shapes of the retrieval baseline (#908), which
      # tests/baseline/test_baseline_build.py builds; those tests skip
      # only off CI too (test_ocr_binaries_are_installed_in_ci).
      - name: Install catdoc, Tesseract and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends catdoc tesseract-ocr poppler-utils

      # The legacy .ppt extractor's Java runtime and jars (#957), built by
      # the same Dockerfile stage the image copies. Its tests skip only
      # off CI: test_ppt_runtime_is_installed_in_ci fails here if the
      # export is missing.
      #
      # The stage's ppt-builder layers are restored from the GitHub
      # Actions cache (BuildKit's gha backend, scope indexer-ppt: the
      # cache docker.yml writes and reads, #1105), so Maven Central is
      # contacted only when indexer/java/pom.xml, its checksums file or
      # a layer before them changed; a fresh runner otherwise fetched the .ppt reader's jars
      # on every run and failed with Maven Central's 429s and 502s
      # (#1070). The build runs on a docker-container builder because
      # the runner's default builder cannot import or export a cache.
      # Exporting the stage to a directory is one build, so the build
      # that restores the layers is the one that reads them for the
      # COPY; the lazy restored layers that made docker.yml load the
      # stage as an image only trip a later build on the same builder,
      # which this job has none of.
      #
      # As in docker.yml, only a pull-request run restores the stage.
      # A run on main (a push, a manual dispatch) builds it cold, so
      # the cache keeps picking up Debian's OpenJDK and Maven updates
      # (a restored apt layer is never rerun), and writes the cache
      # pull-request runs restore; a pull request's own export lands in
      # its ref's cache, which runs on main never see. A failed export
      # (the cache API throttles) is ignored, with a warning in the
      # build log: the next run is cold instead of this one failing
      # before the tests run.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # BuildKit pinned by digest, like the images; the action's
          # default is the moving buildx-stable-1 tag. Dependabot does
          # not track a driver option: bump the tag and digest by hand,
          # together with docker.yml's (scripts/tests/image_pin_test.sh
          # fails while they differ, #1122).
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c

      - name: Export the .ppt reader runtime (from the cache on pull-request runs)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: indexer
          target: ppt-runtime
          outputs: type=local,dest=${{ runner.temp }}/ppt
          # The export is a directory the tests read, not an image to
          # attest: the action's default provenance attestation would
          # write a provenance.json beside opt/ in it.
          provenance: false
          cache-from: ${{ github.event_name == 'pull_request' && 'type=gha,scope=indexer-ppt' || '' }}
          cache-to: type=gha,mode=max,scope=indexer-ppt,ignore-error=true

      - name: Run pytest with coverage
        working-directory: indexer
        env:
          INDEXER_TEST_PPT_HOME: ${{ runner.temp }}/ppt/opt/ppt
        run: uv run pytest -q --cov-report=xml:coverage.xml --cov-report=term

      - name: Upload indexer coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: indexer-coverage
          path: indexer/coverage.xml
          if-no-files-found: error
          retention-days: 14

  mcp-server-pytest:
    name: mcp-server pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: "mcp-server/uv.lock"

      - name: Sync mcp-server environment
        working-directory: mcp-server
        run: uv sync --locked --dev

      - name: Run pytest with coverage
        working-directory: mcp-server
        run: uv run pytest -q --cov-report=xml:coverage.xml --cov-report=term

      - name: Upload mcp-server coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-server-coverage
          path: mcp-server/coverage.xml
          if-no-files-found: error
          retention-days: 14

  retrieval-baseline:
    # Step 1 indexes the synthetic mailbox with the real indexer and a
    # hashed embedder; step 2 checks the golden questions and the rank
    # snapshot through mcp-server's read path. See `make baseline`.
    name: retrieval baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: |
            indexer/uv.lock
            mcp-server/uv.lock

      - name: Sync environments
        run: |
          (cd indexer && uv sync --locked --dev)
          (cd mcp-server && uv sync --locked --dev)

      # The build OCRs the corpus's image and scanned-PDF attachments
      # (#908) with Tesseract and Poppler, as in indexer/Dockerfile, and
      # fails naming the missing binary.
      - name: Install Tesseract and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils

      - name: Build baseline index
        working-directory: indexer
        run: uv run python -m tests.baseline.build "$RUNNER_TEMP/baseline" ../mcp-server/tests/baseline/golden.json ../mcp-server/tests/answer_eval/cases.json

      # Also runs the answer-evaluation harness over every case with a
      # scripted answerer and judge (tests/baseline/test_answer_eval_cases.py):
      # no provider, credential or network.
      - name: Check golden questions, rank snapshot and answer-evaluation cases
        working-directory: mcp-server
        env:
          BASELINE_DIR: ${{ runner.temp }}/baseline
        run: uv run pytest -q --no-cov tests/baseline
