name: Links

# On main the push trigger filters by the files lychee reads. A pull
# request always starts the workflow, so the job reports a check
# (#1559): the `changes` job compares the PR's merge commit with its
# base and lychee runs only when a file matching the same paths
# changed, and is skipped otherwise (a skipped job passes a required
# check). Keep the push filter and the changes job's list the same.
on:
  push:
    branches: [main]
    paths:
      - "*.md"
      - ".github/**/*.md"
      - ".github/**/*.yml"
      - "docs/**/*.md"
      - "docs/**/*.json"
      - "lychee.toml"
  pull_request:
    branches: [main, gate-test-1559-base]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Cancel a pull request's in-progress run when a newer push supersedes it.
# Every other event gets its own group (the run ID), so runs on main,
# scheduled runs and manual dispatches never queue behind or cancel one
# another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether lychee runs; it works as security.yml's changes job
  # does. A failure here runs it rather than skipping it.
  changes:
    name: links inputs changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'pull_request' }}
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Compare the pull request with its base
        id: diff
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            printf 'run=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git rev-parse --verify --quiet HEAD^2 > /dev/null
          changed="$(git diff --name-only HEAD^1 HEAD -- \
            ':(glob)*.md' \
            ':(glob).github/**/*.md' \
            ':(glob).github/**/*.yml' \
            ':(glob)docs/**/*.md' \
            ':(glob)docs/**/*.json' \
            ':(glob)lychee.toml')"
          if [[ -n "$changed" ]]; then
            printf 'Checked files changed:\n%s\n' "$changed"
            printf 'run=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'No checked file changed; lychee is skipped.\n'
            printf 'run=false\n' >> "$GITHUB_OUTPUT"
          fi

  lychee:
    name: lychee
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check repository links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config ./lychee.toml
            README.md AGENTS.md PLAN.md CLAUDE.md
            docs/**/*.md docs/**/*.json
            .github/**/*.md .github/**/*.yml
