name: Security Scan

# The path filters list only files a scanner here reads: Trivy's vuln
# scan reads the uv lockfiles, pyproject.toml and the Maven manifest of
# the indexer's .ppt reader (indexer/java/pom.xml), its misconfig scan
# reads the Dockerfiles (it has no checks for Compose files, shell
# scripts or workflow YAML), Bandit reads indexer/src and
# mcp-server/src, and Semgrep reads the Compose files (base and
# overlays) and shell scripts with the repo's own rules in .semgrep/.
# shellcheck in lint.yml still lints the scripts for correctness, and
# docker.yml validates the Compose syntax and scans the built images
# with Trivy (#977).
on:
  push:
    branches: [main]
    paths:
      - "**/pyproject.toml"
      - "**/uv.lock"
      - "**/pom.xml"
      - "indexer/java/checksums/**"
      - "**/Dockerfile"
      - "indexer/src/**"
      - "mcp-server/src/**"
      - "**/docker-compose*.yml"
      - "**/docker-compose*.yaml"
      - "**/compose*.yml"
      - "**/compose*.yaml"
      - "**/*.sh"
      - "scripts/**"
      - ".semgrep/**"
      - ".semgrepignore"
      - ".github/workflows/security.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/pyproject.toml"
      - "**/uv.lock"
      - "**/pom.xml"
      - "indexer/java/checksums/**"
      - "**/Dockerfile"
      - "indexer/src/**"
      - "mcp-server/src/**"
      - "**/docker-compose*.yml"
      - "**/docker-compose*.yaml"
      - "**/compose*.yml"
      - "**/compose*.yaml"
      - "**/*.sh"
      - "scripts/**"
      - ".semgrep/**"
      - ".semgrepignore"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "0 8 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# Cancel a pull request's in-progress run when a newer push supersedes it.
# Every other event gets its own group (the run ID), so runs on main,
# scheduled runs and manual dispatches never queue behind or cancel one
# another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trivy-deps:
    name: Trivy dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
          cache: true

      # The indexer scan walks indexer/java/pom.xml's dependency tree, and
      # Trivy's Maven analyzer reads each POM from the local repository
      # before asking Maven Central, which rate-limits the shared runner
      # IPs (429; #1069). Trivy has no flag for that repository: it takes
      # `localRepository` from ~/.m2/settings.xml and otherwise uses
      # ~/.m2/repository, the same default Maven writes to. So the job
      # caches that directory, keyed on the POM, and fills it with Maven
      # before the scan: on a warm cache neither Maven nor Trivy fetches
      # anything. The JDK matches the one indexer/Dockerfile builds with
      # (openjdk-21); Maven is preinstalled on the runner. The resolve
      # checks every artifact, from the restored cache as well as from
      # Maven Central, against the committed SHA-256 summary file
      # indexer/java/checksums/checksums.sha256 with the image build's
      # flags (#1117; scripts/tests/maven_checksums_test.sh keeps the
      # two the same), so a cache entry that differs fails the job
      # instead of reaching the scan.
      - name: Cache the Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('indexer/java/pom.xml') }}
          restore-keys: |
            m2-${{ runner.os }}-

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve the .ppt reader's POMs into the Maven repository
        run: >-
          mvn --batch-mode --no-transfer-progress --strict-checksums
          -Daether.artifactResolver.postProcessor.trustedChecksums=true
          -Daether.artifactResolver.postProcessor.trustedChecksums.checksumAlgorithms=SHA-256
          -Daether.artifactResolver.postProcessor.trustedChecksums.failIfMissing=true
          -Daether.artifactResolver.postProcessor.trustedChecksums.record=false
          -Daether.trustedChecksumsSource.summaryFile=true
          "-Daether.trustedChecksumsSource.summaryFile.basedir=$GITHUB_WORKSPACE/indexer/java/checksums"
          -Daether.trustedChecksumsSource.summaryFile.originAware=false
          --file indexer/java/pom.xml dependency:resolve

      # Both scans run even when the other fails, so the job reports every
      # service's findings instead of stopping at the first failing scan
      # (#1016). A failing scan still fails the job. !cancelled() rather
      # than always(), so a superseded run still cancels.
      - name: Scan indexer dependencies
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: indexer
          scanners: vuln
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Scan mcp-server dependencies
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: mcp-server
          scanners: vuln
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

  bandit:
    name: Bandit static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install Bandit
        run: python -m pip install "bandit==1.9.4"

      - name: Scan indexer source
        run: bandit -r indexer/src -ll

      - name: Scan mcp-server source
        run: bandit -r mcp-server/src -ll

  trivy-misconfig:
    name: Trivy misconfiguration scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
          cache: true

      # Trivy's language analyzers run whatever the scanners, and the
      # Maven one resolves indexer/java/pom.xml from Maven Central, which
      # rate-limits the shared runner IPs (429; #1047). This scan reads
      # only the Dockerfiles, so it runs offline (--offline-scan, which
      # the action has no input for); the dependency scan above still
      # resolves pom.xml.
      - name: Scan repository configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          skip-dirs: .git,.ruff_cache,.pytest_cache,.venv,indexer/.venv,mcp-server/.venv,.uv-cache
        env:
          TRIVY_OFFLINE_SCAN: "true"

  semgrep:
    name: Semgrep Compose and shell scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install Semgrep
        run: python -m pip install "semgrep==1.179.0"

      # The rules are the repo's own (.semgrep/*.yaml), not the Semgrep
      # registry, so the checks change only with this repository. Each
      # rule file has a fixture of matching and non-matching cases.
      - name: Test the rules
        run: semgrep test .semgrep

      # `semgrep test` ignores each rule's paths, so check separately that
      # every Compose rule reads every Compose file name.
      - name: Test the Compose rules' file names
        run: bash scripts/tests/semgrep_paths_test.sh

      # Each rule's paths.include picks its targets: docker-compose*.yml,
      # docker-compose*.yaml, compose*.yml and compose*.yaml anywhere in
      # the tree, so a new overlay is scanned without a change here, and
      # every *.sh file. --strict fails the job when a target cannot be
      # parsed instead of skipping it.
      - name: Scan Compose files and shell scripts
        run: >-
          semgrep scan --metrics=off --disable-version-check --strict --error
          --config .semgrep/compose.yaml --config .semgrep/shell.yaml .
