name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel a pull request's in-progress run when a newer push supersedes it.
# Every other event gets its own group (the run ID), so runs on main,
# scheduled runs and manual dispatches never queue behind or cancel one
# another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Seed local config for compose validation
        run: |
          cp .env.example .env
          make init-secrets
          printf 'placeholder-bridge-pass' > .secrets/bridge_pass.txt

      - name: Validate docker compose configuration
        run: docker compose config --quiet

  build-images:
    name: docker compose build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: compose-config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Seed local config for image build
        run: |
          cp .env.example .env
          make init-secrets
          printf 'placeholder-bridge-pass' > .secrets/bridge_pass.txt

      - name: Build local images
        run: docker compose build protonmail-bridge mbsync indexer mcp-server
