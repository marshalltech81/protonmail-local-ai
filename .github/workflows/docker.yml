name: Docker

# Runs when a build input changes: the three build contexts, the
# Compose files, .env.example (copied to .env), the Makefile (make
# init-secrets) and this file, and weekly, like security.yml, so the
# image scan below sees advisories published since the last build. The
# main ruleset requires no status checks, so a skipped run blocks no
# merge.
on:
  push:
    branches: [main]
    paths:
      - "mbsync/**"
      - "indexer/**"
      - "mcp-server/**"
      - "docker-compose*.yml"
      - ".env.example"
      - "Makefile"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: [main]
    paths:
      - "mbsync/**"
      - "indexer/**"
      - "mcp-server/**"
      - "docker-compose*.yml"
      - ".env.example"
      - "Makefile"
      - ".github/workflows/docker.yml"
  schedule:
    - cron: "0 8 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# Cancel a pull request's in-progress run when a newer push supersedes it.
# Every other event gets its own group (the run ID), so runs on main,
# scheduled runs and manual dispatches never queue behind or cancel one
# another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Seed local config for compose validation
        run: |
          cp .env.example .env
          make init-secrets
          printf 'placeholder-bridge-pass' > .secrets/bridge_pass.txt

      - name: Validate docker compose configuration
        run: docker compose config --quiet

  build-images:
    name: docker compose build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: compose-config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Seed local config for image build
        run: |
          cp .env.example .env
          make init-secrets
          printf 'placeholder-bridge-pass' > .secrets/bridge_pass.txt

      # The indexer's ppt-builder stage fetches the .ppt reader's jars
      # from Maven Central, whose outages and rate limits have failed
      # this job (#1070). The stage's layers are kept in the GitHub
      # Actions cache: the step below builds that stage alone on a
      # docker-container builder (the runner's default builder cannot
      # export a cache), importing and exporting the cache under its own
      # scope, so the compose build that follows, on the same builder,
      # finds the stage built and Maven does not run unless
      # indexer/java/pom.xml, its checksums file or a layer before them
      # changed. The step loads the stage as an image rather than
      # building cache-only:
      # restored layers are lazy references into the cache backend that
      # only the restoring build can fetch, and a later build on the
      # builder silently rebuilds a stage it cannot fetch (seen in CI,
      # reproduced locally); loading forces every layer down. Only the
      # layer cache survives a run: the BuildKit cache mount that keeps
      # the Maven repository across local rebuilds lives in the builder,
      # which every run creates anew.
      #
      # Only a pull-request run restores the stage. Every run on main
      # (a push, the weekly schedule, a manual dispatch) builds it cold,
      # so the image keeps picking up Debian's OpenJDK and Maven
      # updates: a restored apt layer is never rerun, and Trivy cannot
      # see the jlink runtime built from it (#1008). Those cold builds
      # are the only writers of the cache pull-request runs read (a
      # pull request's own export lands in its ref's cache, which runs
      # on main never see), so two of them overlapping cannot leave an
      # older stage in it, and a restored stage is never older than the
      # last build on main. A failed export (the cache API throttles) is
      # ignored, with a warning in the build log: the next run is cold
      # instead of this one failing before the images are built and
      # scanned.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # BuildKit pinned by digest, like the images; the action's
          # default is the moving buildx-stable-1 tag. Dependabot does
          # not track a driver option: bump the tag and digest by hand,
          # together with tests.yml's (scripts/tests/image_pin_test.sh
          # fails while they differ, #1122).
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c

      - name: Build the .ppt reader stage (from the cache on pull-request runs)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: indexer
          target: ppt-builder
          load: true
          cache-from: ${{ github.event_name == 'pull_request' && 'type=gha,scope=indexer-ppt' || '' }}
          cache-to: type=gha,mode=max,scope=indexer-ppt,ignore-error=true

      # A fixed project name gives the images fixed names to scan.
      - name: Build local images
        id: build
        env:
          COMPOSE_PROJECT_NAME: protonmail-local-ai
        run: docker compose build mbsync indexer mcp-server

      # Scan the built images (#977), not only the lockfiles security.yml
      # reads: OS packages installed with apt and the .ppt reader's jars
      # are seen only here. Trivy finds no package records for the
      # jlink-built Java runtime in /opt/ppt/jre, so it is not scanned
      # (#1008). Trivy is pinned like security.yml's steps.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
          cache: true

      # The full reports list every severity, unfixed findings included,
      # and never fail the job; they are uploaded below.
      - name: Report indexer image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: protonmail-local-ai-indexer
          scanners: vuln
          format: table
          output: trivy-image-indexer.txt
          exit-code: "0"

      - name: Report mcp-server image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: protonmail-local-ai-mcp-server
          scanners: vuln
          format: table
          output: trivy-image-mcp-server.txt
          exit-code: "0"

      - name: Report mbsync image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: protonmail-local-ai-mbsync
          scanners: vuln
          format: table
          output: trivy-image-mbsync.txt
          exit-code: "0"

      - name: Upload image scan reports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-image-reports
          path: trivy-image-*.txt
          if-no-files-found: error

      # A CycloneDX SBOM per image (#767): the packages Trivy found in
      # the scans above (Debian packages, Python packages, the .ppt
      # reader's jars), with no vulnerability data, which the reports
      # carry. Trivy reads the built image from the daemon, not the
      # checkout, so no .env or secret file is read. The jlink-built
      # Java runtime is missing here too (#1008). Exit code 0: an SBOM
      # step is never a gate.
      - name: Generate indexer image SBOM
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: protonmail-local-ai-indexer
          format: cyclonedx
          output: sbom-indexer.cdx.json
          exit-code: "0"

      - name: Generate mcp-server image SBOM
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: protonmail-local-ai-mcp-server
          format: cyclonedx
          output: sbom-mcp-server.cdx.json
          exit-code: "0"

      - name: Generate mbsync image SBOM
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: protonmail-local-ai-mbsync
          format: cyclonedx
          output: sbom-mbsync.cdx.json
          exit-code: "0"

      - name: Upload image SBOMs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sboms
          path: sbom-*.cdx.json
          if-no-files-found: error
          retention-days: 14

      # The gate: HIGH and CRITICAL, as in security.yml. It skips findings
      # Debian or upstream has not fixed yet (owner decision 2026-10-07,
      # #977), since nothing in this repository can act on them; they
      # stay in the uploaded reports. Each image's gate runs even when
      # another's failed, so one run reports all three.
      - name: Gate indexer image
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: protonmail-local-ai-indexer
          scanners: vuln
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Gate mcp-server image
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: protonmail-local-ai-mcp-server
          scanners: vuln
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Gate mbsync image
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: protonmail-local-ai-mbsync
          scanners: vuln
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
