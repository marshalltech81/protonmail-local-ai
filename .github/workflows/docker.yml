name: Docker

# Runs only when a build input changes: the three build contexts, the
# Compose files, .env.example (copied to .env), the Makefile (make
# init-secrets) and this file. The main ruleset requires no status
# checks, so a skipped run blocks no merge.
on:
  push:
    branches: [main]
    paths:
      - "mbsync/**"
      - "indexer/**"
      - "mcp-server/**"
      - "docker-compose*.yml"
      - ".env.example"
      - "Makefile"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: [main]
    paths:
      - "mbsync/**"
      - "indexer/**"
      - "mcp-server/**"
      - "docker-compose*.yml"
      - ".env.example"
      - "Makefile"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

# Cancel a pull request's in-progress run when a newer push supersedes it.
# Every other event gets its own group (the run ID), so runs on main,
# scheduled runs and manual dispatches never queue behind or cancel one
# another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Seed local config for compose validation
        run: |
          cp .env.example .env
          make init-secrets
          printf 'placeholder-bridge-pass' > .secrets/bridge_pass.txt

      - name: Validate docker compose configuration
        run: docker compose config --quiet

  build-images:
    name: docker compose build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: compose-config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Seed local config for image build
        run: |
          cp .env.example .env
          make init-secrets
          printf 'placeholder-bridge-pass' > .secrets/bridge_pass.txt

      - name: Build local images
        run: docker compose build mbsync indexer mcp-server
