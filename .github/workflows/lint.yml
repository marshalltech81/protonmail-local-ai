name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel a pull request's in-progress run when a newer push supersedes it.
# Every other event gets its own group (the run ID), so runs on main,
# scheduled runs and manual dispatches never queue behind or cancel one
# another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      # Exact pin for the pre-commit runner itself (the hook revs are pinned
      # in .pre-commit-config.yaml). Dependabot does not track a pip install
      # in a run step, so bump this version by hand.
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0

  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true
          # See .hadolint.yaml for why DL3066 is ignored.
          ignore: DL3008,DL3059,DL3066

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # The Ruff version comes from the ruff-pre-commit rev in
      # .pre-commit-config.yaml, the single source of truth, so this job and
      # the pre-commit hook always run the same Ruff. Without an explicit
      # version, ruff-action would install the latest release. Fail if the
      # rev cannot be read rather than fall back to an unpinned Ruff.
      - name: Read Ruff version from .pre-commit-config.yaml
        id: ruff-version
        run: |
          version="$(awk '/repo: https:\/\/github.com\/astral-sh\/ruff-pre-commit$/ { found = 1; next } found && /rev:/ { print $2; exit }' .pre-commit-config.yaml)"
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Could not read an exact ruff-pre-commit rev from .pre-commit-config.yaml\n' >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: ${{ steps.ruff-version.outputs.version }}
          args: "check ."

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: ${{ steps.ruff-version.outputs.version }}
          args: "format --check ."

  compileall:
    name: compileall
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Belt-and-braces around ruff: byte-compiles every source file with
    # CPython 3.14 itself, so syntax that the interpreter rejects fails
    # here even if ruff's parser accepts it. It does not import the
    # modules, so it does not catch broken imports or unresolved names.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Compile indexer sources
        run: python -m compileall -q -f indexer/src

      - name: Compile mcp-server sources
        run: python -m compileall -q -f mcp-server/src

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: |
            indexer/uv.lock
            mcp-server/uv.lock

      - name: Typecheck indexer
        working-directory: indexer
        run: uv run mypy src

      - name: Typecheck mcp-server
        working-directory: mcp-server
        run: uv run mypy src tests/answer_eval
