name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ludeeus/action-shellcheck@2.0.0

  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          recursive: true
          # See .pre-commit-config.yaml for why DL3066 is ignored.
          ignore: DL3008,DL3059,DL3066

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check ."

      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --check ."

  compileall:
    name: compileall
    runs-on: ubuntu-latest
    # Belt-and-braces around ruff: byte-compiles every source file with
    # CPython 3.14 itself, so syntax that the interpreter rejects fails
    # here even if ruff's parser accepts it. It does not import the
    # modules, so it does not catch broken imports or unresolved names.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Compile indexer sources
        run: python -m compileall -q -f indexer/src

      - name: Compile mcp-server sources
        run: python -m compileall -q -f mcp-server/src

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.6"
          enable-cache: true
          cache-dependency-glob: |
            indexer/uv.lock
            mcp-server/uv.lock

      - name: Typecheck indexer
        working-directory: indexer
        run: uv run mypy src

      - name: Typecheck mcp-server
        working-directory: mcp-server
        run: uv run mypy src
