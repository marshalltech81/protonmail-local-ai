# Repository-wide Ruff configuration only, for the pre-commit hook and the
# lint workflow. Not a uv project: each service (indexer/, mcp-server/)
# has its own pyproject.toml and uv.lock.

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes — undefined names, unused imports
    "I",   # isort — import ordering
    "UP",  # pyupgrade — modernize syntax
]
ignore = [
    "E501",  # line too long — handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
