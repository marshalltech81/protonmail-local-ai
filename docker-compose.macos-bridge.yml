# =============================================================================
# macOS Bridge overlay — optional mode (#497)
# =============================================================================
# Uses the official Proton Mail Bridge app running on the macOS host instead
# of the source-built Bridge container. mbsync, the indexer and the MCP server
# still run in containers; the Bridge container is not started or built.
#
# mbsync reaches the app through ``host.docker.internal`` (OrbStack and
# Docker Desktop both provide it). Bridge stays bound to the Mac's loopback
# interface; no port is published and no host networking is used.
#
# TLS: the app's certificate is issued for ``127.0.0.1`` only. isync checks
# the certificate against the configured Host, so mbsync keeps
# ``Host 127.0.0.1`` for verification and opens the TCP connection to
# host.docker.internal through a ``Tunnel`` (socat). Implicit TLS (the
# app's IMAP connection mode must be SSL, #638), certificate
# verification and the persistent fingerprint pin are unchanged, and the
# certificate must also match BRIDGE_CERT_FINGERPRINT from .env. See
# docs/setup.md ("macOS Bridge mode") and docs/architecture.md.
#
# Usage (or the Makefile's *-macos-bridge targets):
#   docker compose -f docker-compose.yml -f docker-compose.macos-bridge.yml up -d
#
# Every command must carry both -f files: a bare ``docker compose up -d
# mbsync`` drops this overlay and recreates mbsync pointed at the Bridge
# container, whose certificate the pin then refuses.
# =============================================================================
services:
  protonmail-bridge:
    # A profile that is never activated keeps the Bridge container out of
    # ``up`` and ``build`` in this mode.
    profiles: ["container-bridge"]

  mbsync:
    # Bridge runs outside Compose, so there is no health check to wait for;
    # the entrypoint's bounded IMAP wait covers an app that is not running.
    depends_on: !reset {}
    environment:
      BRIDGE_HOST: host.docker.internal
      # The app's IMAP port, shown with its IMAP credentials. Read from
      # .env in this mode only; the Bridge container always listens on 1143.
      BRIDGE_IMAP_PORT: ${BRIDGE_IMAP_PORT:-1143}
      # The name the app's certificate is issued for (its CN). When set,
      # the entrypoint verifies the certificate against this name and
      # connects to BRIDGE_HOST:BRIDGE_IMAP_PORT through a tunnel.
      BRIDGE_CERT_HOST: 127.0.0.1
      # Required: the SHA-256 fingerprint of the app's certificate, taken
      # on the Mac (docs/setup.md). Another local account could hold the
      # app's loopback port while it is down, so the first certificate is
      # not trusted on first use as it is with the Bridge container.
      BRIDGE_CERT_FINGERPRINT: ${BRIDGE_CERT_FINGERPRINT:-}
